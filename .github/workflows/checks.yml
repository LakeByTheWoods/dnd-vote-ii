name: Access control checks

on:
  pull_request:
  push:
    branches: [master, fix/host-authorization]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python HTTP, migration and startup tests
        run: python -m unittest discover -s tests -v
      - name: Client integration
        run: node --test tests/test_client.cjs
      - name: Syntax and whitespace
        run: |
          python -m py_compile server.py main.py
          for file in shared.js host.js vote.js results.js; do node --check "$file"; done
          git diff --check
